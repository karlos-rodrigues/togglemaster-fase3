name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SERVICO: __SERVICO__
  AWS_REGION: us-east-1
  ECR_REGISTRY: 217579643777.dkr.ecr.us-east-1.amazonaws.com
  GITOPS_REPO: karlos-rodrigues/togglemaster-gitops

jobs:
  build-test:
    name: Build e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9

  seguranca:
    name: Segurança (SCA e SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: SCA - Trivy (dependências)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SAST - gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          "$(go env GOPATH)/bin/gosec" -severity high -confidence high ./...

  imagem:
    name: Docker build, scan e push
    runs-on: ubuntu-latest
    needs: [build-test, lint, seguranca]
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: echo "tag=v1.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.SERVICO }}:${{ steps.meta.outputs.tag }}
      - name: Container scan - Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.SERVICO }}:${{ steps.meta.outputs.tag }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Credenciais AWS (OIDC)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::217579643777:role/togglemaster-github-ci
          aws-region: ${{ env.AWS_REGION }}
      - name: Login no ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push para o ECR
        if: github.event_name == 'push'
        run: |
          IMG="$ECR_REGISTRY/$SERVICO:${{ steps.meta.outputs.tag }}"
          docker tag "$SERVICO:${{ steps.meta.outputs.tag }}" "$IMG"
          docker push "$IMG"

  gitops:
    name: Atualiza a tag no repositório GitOps
    runs-on: ubuntu-latest
    needs: imagem
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
      - name: Atualiza a imagem no deployment.yaml
        run: |
          F="apps/$SERVICO/deployment.yaml"
          sed -i -E "s#(image: $ECR_REGISTRY/$SERVICO:).*#\1${{ needs.imagem.outputs.tag }}#" "$F"
          git config user.name "Karlos Rodrigues"
          git config user.email "323592744+karlos-rodrigues@users.noreply.github.com"
          git commit -am "$SERVICO: imagem ${{ needs.imagem.outputs.tag }}"
          git push
